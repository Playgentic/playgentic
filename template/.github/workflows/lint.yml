name: Lint

# Formatting, linting, step docstrings and types: the same gates as the
# pre-commit hook, run on every push and pull request.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Step docstrings
        run: npm run lint:steps

      - name: Typecheck
        run: npm run typecheck

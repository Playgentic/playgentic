name: Publish

# On a published GitHub Release, publishes playgentic to npm with provenance.
# Release flow: bump "version" in package.json, commit, tag vX.Y.Z, push, then
# create a GitHub Release for that tag. See "Releasing" in the README.
# Requires an NPM_TOKEN repo secret (an npm automation/granular token with publish
# rights). Provenance (--provenance) needs a public repo + id-token: write.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # required for npm provenance (--provenance)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Guard: on a release, the tag (vX.Y.Z) must match package.json's version so
      # you never publish a mismatched version. Skipped on manual workflow_dispatch.
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          tag="${{ github.event.release.tag_name }}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::package.json is $pkg but the release tag is $tag"
            exit 1
          fi

      - name: Smoke test
        run: npm run smoke

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Scaffolds a suite into a temp dir and runs the zero-dep gates.
      - name: Smoke
        run: npm run smoke

      # Catches packaging mistakes (files whitelist, tarball contents).
      - name: Pack check
        run: npm pack --dry-run

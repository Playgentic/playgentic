name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      # Scaffolds a suite into a temp dir and runs the zero-dep gates.
      - name: Smoke
        run: npm run smoke

      # Catches packaging mistakes (files whitelist, tarball contents).
      - name: Pack check
        run: npm pack --dry-run

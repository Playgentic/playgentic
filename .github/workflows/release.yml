name: Release

# Triggered by the tag the /release skill pushes (see CONTRIBUTING.md). Re-runs CI,
# checks the tag matches package.json, creates the GitHub release from that
# version's CHANGELOG section, then publishes to npm with provenance.
#
# Publishing happens in this workflow, not one triggered by the release event:
# a release created with GITHUB_TOKEN does not trigger other workflows.
#
# Requires an NPM_TOKEN repo secret (an npm automation/granular token with publish
# rights). Provenance (--provenance) needs a public repo + id-token: write.
#
# workflow_dispatch re-publishes the version on an existing tag, e.g. after fixing
# the token. It skips creating the GitHub release if it already exists.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Tag matches package version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::run this workflow on a v*.*.* tag (Use workflow from → Tags)"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node scripts/release.mjs current)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "release v$v already exists; skipping"
          else
            node scripts/release.mjs notes "$v" > "$RUNNER_TEMP/NOTES.md"
            gh release create "v$v" --title "v$v" --notes-file "$RUNNER_TEMP/NOTES.md" --verify-tag
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
